server {
    listen 80;

    # Sert les fichiers statiques générés par Vite
    location / {
        root /usr/share/nginx/html;
        # Nécessaire pour les SPA : redirige les routes inconnues vers index.html
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy : les requêtes /api/* sont transmises au service "api"
    # "api" est le nom du service dans docker-compose → Docker résout le DNS automatiquement
    location /api/ {
        proxy_pass http://api:3000;
    }
}
